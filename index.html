<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Girlfriend's Day!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-frame">
        <div class="header">
            <span class="time">12:09</span>
            <div class="icons">
                <span class="signal">●●●◐</span>
                <span class="battery">831 KB/s 🔋</span>
            </div>
        </div>

        <div class="app-header">
            <span class="back-arrow">←</span>
            <span class="reels-title">Reels <b>⌄</b> Friends</span>
            <div class="profile-pics">
                <div class="pic1"></div>
                <div class="pic2"></div>
                <div class="pic3"></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="birthdayCanvas"></canvas>
            <div id="overlay-text" class="hidden">
                <div class="wish-text">my whole world...</div>
                <h1 class="main-title">Happy<br>GF's Day</h1>
                <div class="final-wish">
                    <p class="and-make">and... you mean everything</p>
                    <p class="hb-text">Happy<br>GF's Day!</p>
                    <p class="bloom-text">here's to us, my love</p>
                </div>
            </div>
        </div>

        <div class="engagement-sidebar">
            <div class="icon-item heart active"></div>
            <span class="count">2,580</span>
            <div class="icon-item comment"></div>
            <span class="count">1,420</span>
            <div class="icon-item share"></div>
            <span class="count">310</span>
            <div class="icon-item options"></div>
            <span class="count">950</span>
            <div class="icon-item bookmark"></div>
            <span class="count">4,120</span>
        </div>

        <div class="footer-description">
            <img src="profile.jpg" alt="Profile" class="footer-pic">
            <div class="footer-text">
                <span class="username">_code_and_chill_ <span class="verified">✓</span></span>
                <span class="follow">Follow</span>
                <p class="caption">Aim for her heart 🏹💗 Happy Girlfriend's Day to my favorite person ...</p>
            </div>
            <div class="music-icon"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item home active"></div>
            <div class="nav-item search"></div>
            <div class="nav-item reels"></div>
            <div class="nav-item shop"></div>
            <div class="nav-item profile"></div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
